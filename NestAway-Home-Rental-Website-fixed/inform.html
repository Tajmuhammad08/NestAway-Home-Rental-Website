<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
    <link rel="stylesheet" href="./styling.css">
    <link rel="icon" href="./images/NESTAWAY.png">
    <title>Room details</title>
</head>
<body>
    <div class = "card-wrapper">
        <div class = "card">
          <!-- card left -->
          <div class = "product-imgs">
            <div class = "img-display">
              <div class = "img-showcase">
                <img id="propertyImage" src = "./images/property-3.jpg" alt = "Rental property">
              </div>
            </div>
          </div>
          <!-- card right -->
          <div class = "product-content">
            <h2 class = "product-title" id="propertyTitle">Your Private Space</h2>
            <a href = "./index.html" class = "product-link">visit site</a>
            <div class = "product-rating">
              <i class = "fas fa-star"></i>
              <i class = "fas fa-star"></i>
              <i class = "fas fa-star"></i>
              <i class = "fas fa-star"></i>
              <i class = "fas fa-star-half-alt"></i>
              <span>4.5(18)</span>
            </div>
      
            <div class = "product-price">
              
              <p class = "price">Price: <span id="propertyPrice">Rs.7500</span></p>
            </div>
      
            <div class = "product-detail">
              <h2>about this home: </h2>
              <p id="propertyDescription">A comfortable rental home with convenient access to local shops and neighborhood services.</p>
              <ul>
                <li>Size <span id="propertyBeds">3 BHK</span></li>
                <li>Available for: <span>Students & Family</span></li>
                <li>Category: <span>Independent</span></li>
                <li>Location: <span id="propertyLocation">New Market, Bhopal MP</span></li>
               
              </ul>
            </div>
      
            <div class = "purchase-info">
              <input type = "number" min = "0" value = "1" max="8">
              <button type = "button" class = "btn" id="payRentButton">
                Pay rent<i class = "fas fa-shopping-cart"></i>
              </button>
              <button type="button" class="btn" id="contactOwnerButton">Contact Owner</button>
            </div>
      
            <div class = "social-links">
              <p>Share At: </p>
              <a href = "#">
                <i class = "fab fa-facebook-f"></i>
              </a>
              <a href = "#">
                <i class = "fab fa-twitter"></i>
              </a>
              <a href = "#">
                <i class = "fab fa-instagram"></i>
              </a>
              <a href = "#">
                <i class = "fab fa-whatsapp"></i>
              </a>
             
            </div>
          </div>
        </div>
      </div>
      <script src="./properties.js"></script>
      <script src="./property-details.js"></script>
      <script src="./sc.js"></script>
      <script>
        document.getElementById('payRentButton').addEventListener('click', () => {
          alert('Payment is not connected in this front-end demo. A payment gateway and backend are required.');
        });
        document.getElementById('contactOwnerButton').addEventListener('click', () => {
          window.location.href = './index.html#contact';
        });
      </script>
</body>
</html>
